<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Семейные расходы</title>
  <link rel="stylesheet" href="static/style.css">
  <script src="static/script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">СЕМЕЙНЫЙ БЮДЖЕТ</p>
        <h1>Расходы</h1>
        <p class="muted">Общий список трат семьи</p>
      </div>
      <button type="button" id="add-button" class="primary">+ Добавить</button>
    </header>

    <section class="summary" aria-label="Итоги">
      <div>
        <span class="muted">Всего за выбранный период</span>
        <strong id="total-amount">—</strong>
      </div>
      <div>
        <span class="muted">Количество трат</span>
        <strong id="expense-count">—</strong>
      </div>
    </section>

    <section class="panel" aria-labelledby="expenses-title">
      <div class="section-header">
        <h2 id="expenses-title">История операций</h2>
        <button type="button" id="refresh-button" class="secondary">Обновить</button>
      </div>

      <form id="filters" class="filters">
        <label>Участник семьи
          <select id="filter-user" name="user_id">
            <option value="">Все участники</option>
          </select>
        </label>
        <label>Категория
          <select id="filter-category" name="category">
            <option value="">Все категории</option>
            <option value="еда">Еда</option>
            <option value="транспорт">Транспорт</option>
            <option value="жильё">Жильё</option>
            <option value="развлечения">Развлечения</option>
            <option value="здоровье">Здоровье</option>
            <option value="покупки">Покупки</option>
            <option value="другое">Другое</option>
          </select>
        </label>
        <label>С даты
          <input id="filter-from" name="from" type="date">
        </label>
        <label>По дату
          <input id="filter-to" name="to" type="date">
        </label>
        <button class="secondary filter-submit" type="submit">Применить</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Участник</th>
              <th>Категория</th>
              <th>Комментарий</th>
              <th class="amount">Сумма</th>
              <th class="actions">Действия</th>
            </tr>
          </thead>
          <tbody id="expenses-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="expense-dialog">
    <form id="expense-form">
      <div class="dialog-heading">
        <h2 id="dialog-title">Новая трата</h2>
        <button type="button" id="close-dialog" class="close" aria-label="Закрыть">×</button>
      </div>
      <label>Telegram ID участника
        <input name="user_id" type="number" min="1" step="1" required>
      </label>
      <label>Сумма, ₽
        <input name="amount" type="number" min="0.01" step="0.01" required>
      </label>
      <label>Категория
        <select name="category" required>
          <option value="еда">Еда</option>
          <option value="транспорт">Транспорт</option>
          <option value="жильё">Жильё</option>
          <option value="развлечения">Развлечения</option>
          <option value="здоровье">Здоровье</option>
          <option value="покупки">Покупки</option>
          <option value="другое">Другое</option>
        </select>
      </label>
      <label>Дата траты
        <input name="spent_at" type="date" required>
      </label>
      <label>Комментарий
        <input name="comment" type="text" maxlength="250" placeholder="Например, кофе">
      </label>
      <p id="form-error" class="form-error" role="alert"></p>
      <footer class="dialog-actions">
        <button type="button" id="cancel-button" class="secondary">Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
